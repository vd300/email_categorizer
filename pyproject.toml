[project]
name = "ai-email-cleaner"
version = "0.1.0"
description = "FastAPI backend for AI email categorization, prioritization, summaries, action items, and reply drafts."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.30",
    "python-dotenv>=1.0.1",
    "openai>=1.35.0",
    "google-api-python-client>=2.134.0",
    "google-auth>=2.30.0",
    "google-auth-oauthlib>=1.2.0",
    "email-validator>=2.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
